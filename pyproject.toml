[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-layer"
version = "0.1.0"
description = "Checks that a number an AI took from a document is really in that document, on the right row."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Lawrence McDonell" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
pdf = ["pdfplumber"]
benchmarks = ["pdfplumber"]
test = ["pytest"]

[project.scripts]
proof-layer = "proof_layer.cli:main"

[tool.setuptools]
packages = ["proof_layer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
